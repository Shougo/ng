name: ci

on:
  push:
  pull_request:
  # Run against Neovim nightly every day, so that UI protocol changes are
  # noticed the day they land: the same early warning GVim gets from living
  # in Vim's own repository.
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        nvim: [stable, nightly]
    steps:
      - name: Install packages
        run: |
          pacman -Syu --noconfirm --needed \
            git go gcc pkgconf sdl3 freetype2 fontconfig curl tar \
            ttf-dejavu otf-ipafont xorg-fonts-type1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # tags, so that the build reports its version

      # The workspace belongs to another user than root in the container;
      # without this git refuses it ("dubious ownership") and go build
      # cannot stamp the VCS information that ng --version reports.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Neovim ${{ matrix.nvim }}
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/${{ matrix.nvim }}/nvim-linux-x86_64.tar.gz
          tar -C /opt -xzf /tmp/nvim.tar.gz
          /opt/nvim-linux-x86_64/bin/nvim --version | head -1

      - name: Vet
        run: go vet ./... && test -z "$(gofmt -l .)"

      - name: Unit tests
        run: go test -race ./...

      - name: Integration tests
        env:
          NG_TEST_NVIM: /opt/nvim-linux-x86_64/bin/nvim
        run: go test -race -tags integration -v ./test/

      - name: Build
        run: |
          go build -o ng ./cmd/ng
          go version -m ng | grep -E '^\s+mod\s|vcs\.revision'

  # Fedora: make sure "go install" keeps working there. Building and the
  # unit tests are enough; the integration tests run on Arch above.
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install packages
        run: |
          dnf install -y git golang gcc pkgconf-pkg-config \
            SDL3-devel freetype-devel fontconfig-devel dejavu-sans-mono-fonts

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: |
          go build -o ng ./cmd/ng
          ./ng --version

  # Debian: SDL3 is packaged since trixie (Ubuntu uses the same packages).
  debian:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates \
            golang-go gcc libc6-dev pkg-config \
            libsdl3-dev libfreetype-dev libfontconfig-dev fonts-dejavu-core

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build
        run: |
          go build -o ng ./cmd/ng
          ./ng --version
